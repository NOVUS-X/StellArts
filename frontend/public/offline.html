<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline — StellArts</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #f1f5f9;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
      }
      h1 {
        font-size: 1.25rem;
        margin-bottom: 8px;
      }
      p {
        color: #94a3b8;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      button {
        margin-top: 16px;
        padding: 10px 20px;
        border-radius: 8px;
        border: none;
        background: #6366f1;
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>No connection</h1>
      <p>
        You're currently offline. Any active jobs you last viewed are available
        from the app — reconnect to see the latest updates.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
